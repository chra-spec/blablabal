<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paylaşımlı Metin Kutusu</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  body { background:#0a0a14; color:#fff; min-height:100vh; display:flex; flex-direction:column; padding:12px; gap:12px; }
  header { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
  h1 { font-size:16px; color:#667eea; }
  .info { font-size:11px; color:#888; }
  .btns { display:flex; gap:8px; flex-wrap:wrap; }
  button { padding:10px 16px; background:#667eea; color:#fff; border:none; border-radius:8px; font-weight:700; cursor:pointer; font-size:13px; transition:background 0.15s; }
  button:hover { background:#5568d3; }
  button.green { background:#27ae60; }
  button.green:hover { background:#1e8449; }
  button.orange { background:#e67e22; }
  button.orange:hover { background:#ca6f1e; }
  button.red { background:#e74c3c; }
  button.red:hover { background:#c0392b; }
  button.gray { background:#333; }
  button.gray:hover { background:#444; }
  button:disabled { opacity:0.5; cursor:not-allowed; }
  .status { padding:8px 12px; background:#1a1a2e; border-radius:8px; font-size:12px; color:#27ae60; border-left:3px solid #27ae60; display:none; }
  .status.error { color:#e74c3c; border-color:#e74c3c; }
  .status.info { color:#f39c12; border-color:#f39c12; }
  .status.active { display:block; }
  textarea { flex:1; width:100%; padding:14px; background:#1a1a2e; color:#e0e0e0; border:1px solid #333; border-radius:10px; font-family:'Consolas', 'Monaco', monospace; font-size:12px; line-height:1.5; outline:none; resize:none; overflow:auto; min-height:50vh; }
  textarea:focus { border-color:#667eea; }
  textarea:disabled { opacity:0.7; }
  .meta { display:flex; justify-content:space-between; font-size:11px; color:#666; padding:0 4px; }
  .loader { display:inline-block; width:12px; height:12px; border:2px solid rgba(255,255,255,0.3); border-top-color:#fff; border-radius:50%; animation:spin 0.8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .readonly-badge { background:#e74c3c; color:#fff; padding:4px 10px; border-radius:12px; font-size:11px; font-weight:700; }
  .owner-badge { background:#27ae60; color:#fff; padding:4px 10px; border-radius:12px; font-size:11px; font-weight:700; }
</style>
</head>
<body>

<header>
  <div>
    <h1>📋 Paylaşımlı Metin Kutusu</h1>
    <div class="info" id="statusInfo">Yükleniyor...</div>
  </div>
  <div class="btns" id="actionBtns"></div>
</header>

<div id="status" class="status"></div>

<textarea id="content" placeholder="Yükleniyor..." disabled></textarea>

<div class="meta">
  <span id="charCount">0 karakter</span>
  <span id="lineCount">0 satır</span>
  <span id="ownerLabel"></span>
</div>

<script>
  // ═══════════════════════════════════════════════════════════
  // ⚡ AYARLAR
  // ═══════════════════════════════════════════════════════════
  const BIN_ID = '6aadbe4bffd5d1605317a2b1';
  const API_KEY = '$2a$10$T8swj7I7d/yXXO8bRF0HAOJ4mxW623tSgNiPG/nZwdS.E6AaBoUFG';
  const API_URL = 'https://api.jsonbin.io/v3/b/' + BIN_ID;
  const REFRESH_INTERVAL = 5000; // 5 saniye

  // ═══════════════════════════════════════════════════════════
  // ⚡ STATE
  // ═══════════════════════════════════════════════════════════
  let myOwnerId = localStorage.getItem('pastebox_owner_id');
  if (!myOwnerId) {
    myOwnerId = 'owner_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
    localStorage.setItem('pastebox_owner_id', myOwnerId);
  }
  let currentOwner = null;
  let isOwner = false;
  let refreshTimer = null;
  let lastContent = '';
  let isSaving = false;
  let hasLocalChanges = false;

  const ta = document.getElementById('content');
  const status = document.getElementById('status');
  const statusInfo = document.getElementById('statusInfo');
  const actionBtns = document.getElementById('actionBtns');
  const charCount = document.getElementById('charCount');
  const lineCount = document.getElementById('lineCount');
  const ownerLabel = document.getElementById('ownerLabel');

  // ═══════════════════════════════════════════════════════════
  // ⚡ YARDIMCILAR
  // ═══════════════════════════════════════════════════════════
  function showStatus(msg, type = 'success') {
    status.textContent = msg;
    status.className = 'status active' + (type === 'error' ? ' error' : type === 'info' ? ' info' : '');
    clearTimeout(status._t);
    status._t = setTimeout(() => status.classList.remove('active'), 3000);
  }

  function updateCounts() {
    const val = ta.value;
    charCount.textContent = val.length.toLocaleString('tr-TR') + ' karakter';
    lineCount.textContent = val.split('\n').length.toLocaleString('tr-TR') + ' satır';
  }

  async function apiGet() {
    const res = await fetch(API_URL + '/latest', {
      headers: { 'X-Master-Key': API_KEY }
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    return data.record || {};
  }

  async function apiSave(content, owner) {
    const res = await fetch(API_URL, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'X-Master-Key': API_KEY
      },
      body: JSON.stringify({ content: content, owner: owner })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  }

  // ═══════════════════════════════════════════════════════════
  // ⚡ UI
  // ═══════════════════════════════════════════════════════════
  function renderUI() {
    actionBtns.innerHTML = '';

    if (isOwner) {
      const saveBtn = document.createElement('button');
      saveBtn.className = 'green';
      saveBtn.innerHTML = '💾 Kaydet';
      saveBtn.onclick = doSave;
      actionBtns.appendChild(saveBtn);

      const clearBtn = document.createElement('button');
      clearBtn.className = 'red';
      clearBtn.innerHTML = '🗑️ Sil';
      clearBtn.onclick = doClear;
      actionBtns.appendChild(clearBtn);

      const refreshBtn = document.createElement('button');
      refreshBtn.className = 'gray';
      refreshBtn.innerHTML = '🔄';
      refreshBtn.title = 'Yenile';
      refreshBtn.onclick = () => doLoad(true);
      actionBtns.appendChild(refreshBtn);

      ta.disabled = false;
      ta.placeholder = 'index.html kodunu buraya yapıştır...';
      statusInfo.innerHTML = '<span class="owner-badge">👑 SAHİPSİN — Yazabilirsin</span>';
      if (currentOwner) ownerLabel.textContent = 'Sahip ID: ' + currentOwner.substr(0, 15) + '...';
    } else {
      const refreshBtn = document.createElement('button');
      refreshBtn.className = 'gray';
      refreshBtn.innerHTML = '🔄 Yenile';
      refreshBtn.onclick = () => doLoad(true);
      actionBtns.appendChild(refreshBtn);

      const copyBtn = document.createElement('button');
      copyBtn.className = 'orange';
      copyBtn.innerHTML = '📋 Kopyala';
      copyBtn.onclick = doCopy;
      actionBtns.appendChild(copyBtn);

      ta.disabled = true;
      ta.placeholder = 'İçerik sahibi tarafından doldurulacak...';
      statusInfo.innerHTML = '<span class="readonly-badge">🔒 SADECE OKUNABİLİR</span>';
      if (currentOwner) ownerLabel.textContent = 'Sahip ID: ' + currentOwner.substr(0, 15) + '...';
      else ownerLabel.textContent = '';
    }
  }

  // ═══════════════════════════════════════════════════════════
  // ⚡ ANA FONKSİYONLAR
  // ═══════════════════════════════════════════════════════════
  async function doLoad(showStatusMsg = false) {
    try {
      statusInfo.innerHTML = '<span class="loader"></span> Yükleniyor...';
      const data = await apiGet();
      const content = data.content || '';
      currentOwner = data.owner || null;

      // İlk yükleme veya boş owner → ben sahip olurum
      if (!currentOwner) {
        currentOwner = myOwnerId;
        isOwner = true;
        // Sunucuya kaydet
        await apiSave(content, currentOwner);
      } else {
        isOwner = (currentOwner === myOwnerId);
      }

      // Eğer ben yazmıyorsam veya değişiklik yoksa içeriği güncelle
      if (!hasLocalChanges || !isOwner) {
        if (ta.value !== content) {
          ta.value = content;
          lastContent = content;
        }
      }

      updateCounts();
      renderUI();
      if (showStatusMsg) showStatus('✅ Güncellendi');
    } catch (e) {
      console.error('Yükleme hatası:', e);
      statusInfo.innerHTML = '<span style="color:#e74c3c;">❌ Bağlantı hatası</span>';
      showStatus('❌ Bağlantı hatası: ' + e.message, 'error');
    }
  }

  async function doSave() {
    if (!isOwner) {
      showStatus('Bu kutunun sahibi değilsin', 'error');
      return;
    }
    if (isSaving) return;

    isSaving = true;
    hasLocalChanges = false;
    try {
      showStatus('💾 Kaydediliyor...', 'info');
      await apiSave(ta.value, myOwnerId);
      lastContent = ta.value;
      showStatus('✅ Kaydedildi — herkes görüyor');
    } catch (e) {
      console.error('Kaydetme hatası:', e);
      showStatus('❌ Kaydedilemedi: ' + e.message, 'error');
      hasLocalChanges = true;
    } finally {
      isSaving = false;
    }
  }

  async function doClear() {
    if (!isOwner) return;
    if (!confirm('İçeriği silmek istediğine emin misin?\n\nBu işlem herkes için siler.')) return;
    try {
      ta.value = '';
      await apiSave('', myOwnerId);
      lastContent = '';
      updateCounts();
      showStatus('🗑️ Silindi — herkes için temizlendi');
    } catch (e) {
      showStatus('❌ Silinemedi: ' + e.message, 'error');
    }
  }

  async function doCopy() {
    try {
      await navigator.clipboard.writeText(ta.value);
      showStatus('✅ Panoya kopyalandı');
    } catch (e) {
      // Fallback
      ta.disabled = false;
      ta.select();
      document.execCommand('copy');
      ta.disabled = true;
      showStatus('✅ Panoya kopyalandı');
    }
  }

  // ═══════════════════════════════════════════════════════════
  // ⚡ OTOMATİK YENİLEME
  // ═══════════════════════════════════════════════════════════
  function startAutoRefresh() {
    if (refreshTimer) clearInterval(refreshTimer);
    refreshTimer = setInterval(() => {
      // Sahip değilsek ve yazmıyorsak otomatik yenile
      if (!isOwner && !ta.disabled) {
        doLoad(false);
      }
    }, REFRESH_INTERVAL);
  }

  // ═══════════════════════════════════════════════════════════
  // ⚡ OLAYLAR
  // ═══════════════════════════════════════════════════════════
  ta.addEventListener('input', () => {
    hasLocalChanges = true;
    updateCounts();
  });

  // Ctrl+S ile kaydet
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 's') {
      e.preventDefault();
      if (isOwner) doSave();
    }
  });

  // Sayfa kapanırken kaydedilmemiş değişiklik uyarısı
  window.addEventListener('beforeunload', (e) => {
    if (isOwner && hasLocalChanges) {
      e.preventDefault();
      e.returnValue = '';
    }
  });

  // ═══════════════════════════════════════════════════════════
  // ⚡ BAŞLAT
  // ═══════════════════════════════════════════════════════════
  doLoad();
  startAutoRefresh();
</script>

</body>
</html>
